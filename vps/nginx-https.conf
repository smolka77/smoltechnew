# HTTPS + dostęp po IP (HTTP)
# http://213.239.130.251/ → strona
# http(s)://xtechart.com/ → HTTPS domeny

# --- HTTP default / IP — BEZ redirectu na domenę (musi być default_server) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 213.239.130.251 _;

    root /var/www/smoltech.com.ua;
    index index.html index.php;
    client_max_body_size 8m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location ^~ /_private/ { return 403; }
    location ^~ /_src/     { return 403; }
    location ^~ /_build/   { return 403; }

    location = /send.php { rewrite ^ /wyslij.php last; }
    location = /assets/css/site.css { rewrite ^ /assets/css/strona.css last; }
    location = /assets/js/site.js { rewrite ^ /assets/js/strona.js last; }
    location = /assets/js/i18n.js { rewrite ^ /assets/js/tlumaczenia.js last; }
    location = /assets/js/i18n-cms.js { rewrite ^ /assets/js/nakladka-jezyk.js last; }
    location = /panel/i18n.js { rewrite ^ /panel/jezyk.js last; }
    location = /assets/fonts/faces.css { rewrite ^ /assets/fonts/czcionki.css last; }
    location = /panel/api.php { rewrite ^ /panel/obsluga.php last; }
    location = /panel/app.js { rewrite ^ /panel/panel.js last; }
    location = /panel/app.css { rewrite ^ /panel/panel.css last; }

    location = /o-firmie { return 301 /pro-kompaniyu/; }
    location = /o-firmie/ { return 301 /pro-kompaniyu/; }
    location = /kompetencje { return 301 /kompetentsiyi/; }
    location = /kompetencje/ { return 301 /kompetentsiyi/; }
    location = /kontakt { return 301 /kontakty/; }
    location = /kontakt/ { return 301 /kontakty/; }
    location = /realizacje { return 301 /video-avtomatyzatsiya-zvaryuvannya/; }
    location = /realizacje/ { return 301 /video-avtomatyzatsiya-zvaryuvannya/; }
    location = /filmy { return 301 /video-avtomatyzatsiya-zvaryuvannya/; }
    location = /filmy/ { return 301 /video-avtomatyzatsiya-zvaryuvannya/; }
    location = /przypawanie-trzpieni { return 301 /pryvaryuvannya-shpylok/; }
    location = /przypawanie-trzpieni/ { return 301 /pryvaryuvannya-shpylok/; }
    location = /polityka-prywatnosci { return 301 /polityka-konfidentsiynosti/; }
    location = /polityka-prywatnosci/ { return 301 /polityka-konfidentsiynosti/; }

    location ~* \.(env|htaccess|htpasswd|git.*)$ { return 403; }
    location ~* \.(ps1|md|log|bak)$ { return 403; }
    location ~ /(auth\.env|start\.php|zapytania\.json|magazyn\.php|skrzynka\.php|limity-logowan\.json)$ { return 403; }

    location ~ \.php$ {
        include /etc/nginx/fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }

    location ~* \.(css|js|woff2?|webp|jpe?g|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    include /etc/nginx/snippets/lead-proxy.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}

# --- HTTP: tylko domena → HTTPS (NIE default, bez _) ---
server {
    listen 80;
    listen [::]:80;
    server_name xtechart.com www.xtechart.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://xtechart.com$request_uri;
    }
}

# --- HTTPS: www → apex ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.xtechart.com;

    ssl_certificate /etc/letsencrypt/live/xtechart.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xtechart.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://xtechart.com$request_uri;
}

# --- HTTPS: domena ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name xtechart.com;

    ssl_certificate /etc/letsencrypt/live/xtechart.com/fullchain.pem;
